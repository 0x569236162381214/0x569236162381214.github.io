<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa Bulunamadı - 404 | Özdoyum Yemek Hizmeti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #FAF8F5;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #232323;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px 20px;
        }
        .error-code {
            font-family: 'Cormorant Garamond', serif;
            font-size: 120px;
            font-weight: 700;
            color: #C9A96E;
            line-height: 1;
            margin: 0 0 20px 0;
            text-shadow: 0 10px 30px rgba(201, 169, 110, 0.2);
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            color: #1E231E;
            margin: 0 0 15px 0;
        }
        p {
            color: #595347;
            font-size: 16px;
            line-height: 1.6;
            margin: 0 0 40px 0;
        }
        .btn {
            display: inline-block;
            background-color: #1F241F;
            color: #FAF8F5;
            padding: 16px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: #C9A96E;
            color: #1F241F;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(201, 169, 110, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1>Aradığınız Sayfa Bulunamadı</h1>
        <p>Maalesef ulaşmaya çalıştığınız sayfa yayından kaldırılmış, ismi değiştirilmiş veya geçici olarak ulaşılamıyor olabilir. Yemeğin soğumasına izin vermeden sizi anasayfaya alalım.</p>
        <a href="/" class="btn">Anasayfaya Dön</a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethereum Provider Test</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .panel {
            width: 420px;
            padding: 30px;
            background: #1f2937;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,.4);
        }

        h2 {
            margin-top: 0;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #f59e0b;
            color: #111827;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            padding: 12px;
            background: #111827;
            border-radius: 8px;
            font-size: 14px;
        }

        .result {
            margin-top: 15px;
            line-height: 1.8;
        }

        .log {
            margin-top: 15px;
            height: 180px;
            overflow-y: auto;
            padding: 10px;
            background: #0b1120;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="panel">
    <h2>🧪 Ethereum Provider Test</h2>

    <button id="startBtn">
        Stress Test Başlat
    </button>

    <div id="status">
        Hazır
    </div>

    <div class="result">
        <div>Toplam: <span id="total">0</span></div>
        <div>Başarılı: <span id="success">0</span></div>
        <div>Reddedilen: <span id="failed">0</span></div>
        <div>Tamamlanan: <span id="completed">0</span></div>
    </div>

    <div id="log" class="log"></div>
</div>

<script>
const startBtn = document.getElementById("startBtn");
const statusEl = document.getElementById("status");
const totalEl = document.getElementById("total");
const successEl = document.getElementById("success");
const failedEl = document.getElementById("failed");
const completedEl = document.getElementById("completed");
const logEl = document.getElementById("log");

startBtn.addEventListener("click", async () => {

    const provider = window.braveEthereum || window.ethereum;

    if (!provider) {
        statusEl.textContent = "❌ Ethereum provider bulunamadı.";
        return;
    }

    const totalRequests = 50;

    let completed = 0;
    let successful = 0;
    let rejected = 0;

    startBtn.disabled = true;
    startBtn.textContent = "⏳ Test çalışıyor...";

    totalEl.textContent = totalRequests;
    successEl.textContent = "0";
    failedEl.textContent = "0";
    completedEl.textContent = "0";
    logEl.innerHTML = "";

    statusEl.textContent = "🧪 Test başlatıldı...";

    console.log("🧪 Stress Test başlatılıyor...");

    const requests = [];

    for (let i = 0; i < totalRequests; i++) {

        const requestNumber = i + 1;

        const request = provider.request({
            method: "eth_requestAccounts"
        })
        .then(() => {

            successful++;

            successEl.textContent = successful;

            addLog(
                `✅ İstek ${requestNumber}: başarılı`
            );

            console.log(
                `✅ İstek ${requestNumber}: başarılı`
            );

        })
        .catch((err) => {

            rejected++;

            failedEl.textContent = rejected;

            addLog(
                `❌ İstek ${requestNumber}: ${err?.message || err}`
            );

            console.log(
                `❌ İstek ${requestNumber} reddedildi:`,
                err
            );

        })
        .finally(() => {

            completed++;

            completedEl.textContent = completed;

            statusEl.textContent =
                `⏳ ${completed}/${totalRequests} tamamlandı`;
        });

        requests.push(request);
    }

    await Promise.all(requests);

    statusEl.textContent = "🛡️ Tüm istekler tamamlandı.";

    startBtn.disabled = false;
    startBtn.textContent = "🔄 Testi Tekrar Çalıştır";

    console.log("🛡️ Tüm istekler tamamlandı.");
    console.log(`📊 Toplam: ${totalRequests}`);
    console.log(`✅ Başarılı: ${successful}`);
    console.log(`❌ Reddedilen: ${rejected}`);
});


function addLog(message) {

    const line = document.createElement("div");

    line.textContent = message;

    logEl.appendChild(line);

    logEl.scrollTop = logEl.scrollHeight;
}
</script>

</body>
</html>
